<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Club Night | RJD Archers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-6 font-sans text-slate-800">
<div class="max-w-3xl mx-auto space-y-5">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <p class="text-sm"><a class="underline text-purple-700" href="/index.html">&larr; Home</a></p>
        <h1 class="text-2xl font-bold text-purple-950 mt-2">Club nights</h1>
        <p class="text-sm text-slate-600 mt-1">Booking opens at <b>5pm the day before</b> and closes at <b>5pm on the day</b>. Adults book for themselves. Only a parent or guardian can book for a child under 18.</p>
        <div id="gate" class="mt-3 text-sm"></div>
        <label id="whoWrap" class="hidden text-sm block mt-3">Booking for
            <select id="who" class="w-full border border-slate-300 p-2 rounded mt-1"></select></label>
    </div>
    <div id="nights" class="space-y-3"></div>
    <div id="msg" class="text-sm text-center font-medium"></div>
</div>
<script>
    const SUPABASE_URL = 'https://onepmhddrqmvhyhagkth.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const say = (t, bad) => { $('msg').className = 'text-sm text-center font-medium ' + (bad ? 'text-red-600' : 'text-green-700'); $('msg').textContent = t || ''; };
    let nights = [], people = [], mine = [], places = {}, signedIn = false;

    // UK clock: is the booking window open for this night date (YYYY-MM-DD)?
    function ukNow() { const p = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/London', dateStyle: 'short', timeStyle: 'short' }).format(new Date()); return p.replace(' ', 'T'); }
    function windowState(d) {
        const now = ukNow(), day = new Date(d + 'T00:00:00Z'); const prev = new Date(day - 864e5).toISOString().slice(0, 10);
        if (now < prev + 'T17:00') return 'before'; if (now >= d + 'T17:00') return 'closed'; return 'open';
    }
    const gb = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    function describe(n) {
        const d = n.range_distance ? n.range_distance + ' ' + n.range_unit : '';
        return n.kind === 'indoor' ? `Indoor, ${d}, ${esc(n.target_size)} ${esc(n.target_type)} faces` : `Outdoor, ${d}`;
    }
    function render() {
        const who = $('who').value;
        $('nights').innerHTML = nights.map(n => {
            const st = windowState(n.night_date), pl = places[n.id] || { taken: 0, max_places: n.max_places };
            const full = pl.max_places && pl.taken >= pl.max_places;
            const b = mine.find(x => x.night_id === n.id && x.member_id === who && x.status === 'booked');
            let action = '';
            if (n.cancelled) action = '';
            else if (!signedIn) action = '<span class="text-xs text-slate-500">Sign in to book</span>';
            else if (b) action = st !== 'closed' ? `<button class="cancel text-red-600 underline text-sm" data-id="${esc(b.id)}">Cancel booking</button>` : '';
            else if (st === 'before') action = '<span class="text-xs text-slate-500">Opens 5pm the day before</span>';
            else if (st === 'closed') action = '<span class="text-xs text-slate-500">Closed</span>';
            else if (full) action = '<span class="text-xs text-red-700 font-semibold">Full</span>';
            else if (who) action = `<button class="book bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded text-sm font-semibold" data-id="${esc(n.id)}">Book</button>`;
            return `<div class="bg-white p-4 rounded-xl border ${b ? 'border-green-300' : 'border-slate-200'} flex flex-wrap justify-between items-center gap-2">
                <div><div class="font-bold">${esc(gb(n.night_date))}</div>
                <div class="text-sm text-slate-600">${n.start_time ? esc(n.start_time.slice(0, 5)) + (n.end_time ? '–' + esc(n.end_time.slice(0, 5)) : '') + ' · ' : ''}${describe(n)}${n.venue ? ' · ' + esc(n.venue) : ''}${n.fee != null ? ' · £' + Number(n.fee).toFixed(2) : ''}</div>
                ${n.cancelled ? '<div class="text-sm font-semibold text-red-700">Cancelled' + (n.cancel_reason ? ': ' + esc(n.cancel_reason) : '') + '</div>' : ''}
                <div class="text-xs text-slate-500">${pl.max_places ? pl.taken + ' of ' + pl.max_places + ' places taken' : pl.taken + ' booked'}${n.notes ? ' · ' + esc(n.notes) : ''}</div>
                ${b ? '<div class="text-xs text-green-700 font-semibold">Booked' + (b.paid ? ', paid' : '') + '</div>' : ''}</div><div>${action}</div></div>`;
        }).join('') || '<p class="text-center text-slate-500">No club nights are listed yet.</p>';
    }
    $('who').addEventListener('change', render);
    async function load() {
        const today = new Date().toISOString().slice(0, 10);
        const { data } = await sb.from('club_nights').select('*').gte('night_date', today).order('night_date').limit(30);
        nights = data || [];
        await Promise.all(nights.map(async n => { const { data: p } = await sb.rpc('club_night_places', { p_night: n.id }); places[n.id] = Array.isArray(p) ? p[0] : p; }));
        if (signedIn) { const { data: m } = await sb.from('club_night_bookings').select('id,night_id,member_id,status,paid').eq('status', 'booked'); mine = m || []; }
        render();
    }
    $('nights').addEventListener('click', async e => {
        const c = e.target.classList;
        if (c.contains('book')) {
            const { error } = await sb.rpc('book_club_night', { p_night: e.target.dataset.id, p_member: $('who').value });
            if (error) return say(error.code === '42501' && /2FA/.test(error.message) ? 'Please enter your 2FA code first.' : /duplicate/.test(error.message) ? 'Already booked.' : error.message, true);
            say('Booked.'); load();
        } else if (c.contains('cancel')) {
            if (!confirm('Cancel this booking?')) return;
            const { error } = await sb.rpc('cancel_club_night_booking', { p_id: e.target.dataset.id });
            if (error) return say(error.message, true);
            say('Booking cancelled.'); load();
        }
    });
    async function start() {
        const { data: { session } } = await sb.auth.getSession();
        const gate = $('gate');
        if (!session) {
            gate.innerHTML = '<button id="loginBtn" class="bg-purple-600 text-white px-4 py-2 rounded font-semibold">Sign in to book</button>';
            $('loginBtn').onclick = async () => {
                const email = prompt('Your email address:'); if (!email) return;
                const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
                say(error ? error.message : 'Check your email for the sign-in link.', !!error);
            };
            return load();
        }
        signedIn = true;
        const { data: me } = await sb.from('members').select('id,name,dob,membertype').eq('auth_id', session.user.id).maybeSingle();
        const { data: a } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
        gate.innerHTML = (a && a.currentLevel === 'aal2') ? '<span class="text-green-700">Signed in with 2FA ✓</span>' : '<span class="text-red-700">2FA needed to book.</span> <a class="underline text-purple-700" href="/db/security.html?next=/db/club-nights.html">Enter your 2FA code</a>';
        if (me) {
            const adult = me.dob && (Date.now() - new Date(me.dob)) / 31557600000 >= 18;
            if (['member', 'guest'].includes(me.membertype) && adult) people.push({ id: me.id, name: me.name + ' (me)' });
            const { data: links } = await sb.from('member_guardians').select('child_id').eq('guardian_member_id', me.id);
            const ids = (links || []).map(l => l.child_id);
            if (ids.length) {
                const { data: kids } = await sb.from('members').select('id,name,dob,membertype').in('id', ids).order('name');
                (kids || []).filter(k => ['member', 'guest'].includes(k.membertype) && k.dob && (Date.now() - new Date(k.dob)) / 31557600000 < 18).forEach(k => people.push({ id: k.id, name: k.name }));
            }
        }
        if (people.length) { $('who').innerHTML = people.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join(''); $('whoWrap').classList.remove('hidden'); }
        else gate.innerHTML += '<p class="mt-1">Only members and registered guests can book (parents book for their under-18 child who is a member).</p>';
        load();
    }
    start();
</script>
</body>
</html>
