<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Course Registration | RJD Archers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 font-sans text-slate-800">
    <div class="max-w-xl mx-auto space-y-6">
        v3
        <!-- Live Read Test Box -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-purple-950 mb-2">1. Database Read Test (On Page Load)</h2>
            <div id="readStatus" class="p-3 rounded text-sm bg-slate-50 border border-slate-200 font-mono text-xs overflow-x-auto">
                Connecting via Direct REST API...
            </div>
        </div>

        <!-- Write Form Box -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-purple-950 mb-2">2. Beginner Course Registration</h2>
            <p class="text-sm text-slate-600 mb-4">Sign up to join our next beginner coaching block.</p>
            
            <form id="beginnerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Full Name</label>
                    <input type="text" id="name" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email Address</label>
                    <input type="email" id="email" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Mobile Number</label>
                    <input type="tel" id="mobile" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded font-semibold hover:bg-purple-700 transition shadow">
                    Submit Registration
                </button>
            </form>

            <div id="msg" class="hidden mt-6 p-4 rounded-lg text-sm font-medium text-center transition-all"></div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://onepmhddrqmvhyehagkth.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';

        // --- DIRECT REST READ TEST ON LOAD ---
        async function runReadTest() {
            const readBox = document.getElementById('readStatus');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/members?select=*&limit=1`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    readBox.className = "p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                    readBox.innerHTML = `<strong>READ FAILED (HTTP ${response.status}):</strong><br>` + JSON.stringify(data, null, 2);
                } else {
                    readBox.className = "p-3 rounded text-sm bg-green-50 border border-green-200 font-mono text-xs text-green-800";
                    readBox.innerHTML = `<strong>✅ READ SUCCESS! Connected to database.</strong><br>Found ${data.length} row(s).`;
                }
            } catch (err) {
                readBox.className = "p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                readBox.innerHTML = `<strong>NETWORK EXCEPTION ON READ:</strong><br>` + err.message;
            }
        }

        runReadTest();

        // --- DIRECT REST INSERT ON SUBMIT ---
        document.getElementById('beginnerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";
            msg.classList.remove('hidden');
            msg.textContent = "Sending registration details to database...";
            msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-slate-100 text-slate-700 border border-slate-200";

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const mobile = document.getElementById('mobile').value;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/members`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        mobile: mobile,
                        membertype: 'beginner'
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    console.error("Supabase Error:", result);
                    msg.innerHTML = `⚠️ <strong>Database Error:</strong> ${result.message || JSON.stringify(result)}`;
                    msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Registration";
                } else {
                    console.log("Success:", result);
                    msg.innerHTML = "🎉 <strong>Registration Successful!</strong> Thank you. We have received your details and will be in touch soon.";
                    msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-green-50 text-green-700 border border-green-200 shadow-sm";
                    
                    document.getElementById('beginnerForm').reset();
                    submitBtn.style.display = 'none';
                }
            } catch (err) {
                console.error("Network Exception:", err);
                msg.innerHTML = `⚠️ <strong>Network Error:</strong> ${err.message}`;
                msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Registration";
            }
        });
    </script>
</body>
</html>
