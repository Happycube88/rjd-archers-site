<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Registration | RJD Archers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-6 font-sans text-slate-800">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold text-purple-950 mb-2">Beginner Course Registration</h1>
        <p class="text-sm text-slate-600 mb-6">Sign up to join our next beginner coaching block.</p>
        
        <form id="beginnerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Full Name</label>
                <input type="text" id="name" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
                <input type="email" id="email" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Mobile Number</label>
                <input type="tel" id="mobile" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-purple-600 text-white py-2.5 rounded font-semibold hover:bg-purple-700 transition shadow">Submit Registration</button>
        </form>
        <p id="msg" class="mt-4 text-center text-sm font-medium"></p>
    </div>

  <script>
    const SUPABASE_URL = 'https://onepmhddrqmvhyehagkth.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';
    
    // Declare 'supabase' ONCE globally here
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('beginnerForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop form from doing a traditional page refresh
        
        const submitBtn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        
        // Show loading status
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";
        }
        
        msg.classList.remove('hidden');
        msg.textContent = "Sending registration details...";
        msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-slate-100 text-slate-700 border border-slate-200";

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const mobile = document.getElementById('mobile').value;

        try {
            // Use the client variable created above
            const { data, error } = await supabaseClient
                .from('members')
                .insert([{ name: name, email: email, mobile: mobile, membertype: 'beginner' }]);

            if (error) {
                console.error("Supabase Error:", error);
                msg.textContent = "⚠️ Error: " + error.message;
                msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Registration";
                }
            } else {
                console.log("Success:", data);
                msg.textContent = "🎉 Registration successful! We have received your details and will be in touch soon.";
                msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-green-50 text-green-700 border border-green-200 shadow-sm";
                
                document.getElementById('beginnerForm').reset();
                if (submitBtn) submitBtn.style.display = 'none'; // Hide submit button to prevent duplicate entries
            }
        } catch (err) {
            console.error("Script/Network Error:", err);
            msg.textContent = "⚠️ Unexpected error: " + err.message;
            msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
            
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Registration";
            }
        }
    });
</script>

</body>
</html>
