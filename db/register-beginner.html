<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> v2 DB Diagnostic Test | RJD Archers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-6 font-sans text-slate-800">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Live Read Test Box -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-purple-950 mb-2">1. Database Read Test (On Page Load)</h2>
            <div id="readStatus" class="p-3 rounded text-sm bg-slate-50 border border-slate-200 font-mono text-xs overflow-x-auto">
                Connecting and reading database...
            </div>
        </div>

        <!-- Write Form Box -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-purple-950 mb-2">2. Database Write Test (Form Submit)</h2>
            <form id="testForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Test Name</label>
                    <input type="text" id="name" value="Web Test User" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Test Email</label>
                    <input type="email" id="email" value="webtest@example.com" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Test Mobile</label>
                    <input type="tel" id="mobile" value="07123456789" required class="w-full border p-2 rounded mt-1">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2 rounded font-semibold hover:bg-purple-700">
                    Test Insert (Write)
                </button>
            </form>
            <div id="writeStatus" class="hidden mt-4 p-3 rounded text-sm font-mono text-xs overflow-x-auto"></div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://onepmhddrqmvhyehagkth.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- TEST 1: READ FROM DATABASE ON LOAD ---
        async function runReadTest() {
            const readBox = document.getElementById('readStatus');
            try {
                const { data, error, status } = await supabaseClient
                    .from('members')
                    .select('*')
                    .limit(5);

                if (error) {
                    readBox.className = "p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                    readBox.innerHTML = `<strong>READ FAILED (Status ${status}):</strong><br>` + JSON.stringify(error, null, 2);
                } else {
                    readBox.className = "p-3 rounded text-sm bg-green-50 border border-green-200 font-mono text-xs text-green-800";
                    readBox.innerHTML = `<strong>READ SUCCESS! Found ${data.length} row(s):</strong><br>` + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                readBox.className = "p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                readBox.innerHTML = `<strong>NETWORK EXCEPTION ON READ:</strong><br>` + err.message;
            }
        }

        runReadTest();

        // --- TEST 2: WRITE / INSERT TO DATABASE ON SUBMIT ---
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const writeBox = document.getElementById('writeStatus');
            writeBox.classList.remove('hidden');
            writeBox.className = "mt-4 p-3 rounded text-sm bg-slate-50 border border-slate-200 font-mono text-xs text-slate-700";
            writeBox.textContent = "Attempting to insert row...";

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const mobile = document.getElementById('mobile').value;

            try {
                const { data, error, status } = await supabaseClient
                    .from('members')
                    .insert([{ 
                        name: name, 
                        email: email, 
                        mobile: mobile, 
                        membertype: 'beginner' 
                    }])
                    .select(); // Request returned data to verify insert

                if (error) {
                    writeBox.className = "mt-4 p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                    writeBox.innerHTML = `<strong>WRITE FAILED (Status ${status}):</strong><br>` + JSON.stringify(error, null, 2);
                } else {
                    writeBox.className = "mt-4 p-3 rounded text-sm bg-green-50 border border-green-200 font-mono text-xs text-green-800";
                    writeBox.innerHTML = `<strong>WRITE SUCCESS! Inserted row:</strong><br>` + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                writeBox.className = "mt-4 p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                writeBox.innerHTML = `<strong>NETWORK EXCEPTION ON WRITE:</strong><br>` + err.message;
            }
        });
    </script>
</body>
</html>
