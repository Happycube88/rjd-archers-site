<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Course Registration | RJD Archers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 font-sans text-slate-800">
    <div class="max-w-xl mx-auto space-y-6">
        v4
        <!-- Diagnostic Status Box -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-purple-950 mb-2">Supabase Connection Test</h2>
            <div id="connectionStatus" class="p-3 rounded text-sm bg-slate-50 border border-slate-200 font-mono text-xs">
                Testing connection to Supabase table...
            </div>
        </div>

        <!-- Registration Form Box -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-purple-950 mb-2">Beginner Course Registration</h2>
            <p class="text-sm text-slate-600 mb-4">Sign up to join our next beginner coaching block.</p>
            
            <form id="beginnerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Full Name</label>
                    <input type="text" id="name" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email Address</label>
                    <input type="email" id="email" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Mobile Number</label>
                    <input type="tel" id="mobile" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded font-semibold hover:bg-purple-700 transition shadow">
                    Submit Registration
                </button>
            </form>

            <div id="msg" class="hidden mt-6 p-4 rounded-lg text-sm font-medium text-center transition-all"></div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://onepmhddrqmvhyehagkth.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24i planas...eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';

        // Clean key string assignment
        const cleanKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';

        // --- TEST CONNECTION ON LOAD ---
        async function testConnection() {
            const statusBox = document.getElementById('connectionStatus');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/members?select=id&limit=1`, {
                    method: 'GET',
                    headers: {
                        'apikey': cleanKey,
                        'Authorization': `Bearer ${cleanKey}`
                    }
                });

                if (response.ok) {
                    statusBox.className = "p-3 rounded text-sm bg-green-50 border border-green-200 font-medium text-green-800";
                    statusBox.innerHTML = "✅ <strong>Supabase Connected Successfully:</strong> Ready for registrations.";
                } else {
                    const errText = await response.text();
                    statusBox.className = "p-3 rounded text-sm bg-yellow-50 border border-yellow-200 font-mono text-xs text-yellow-800";
                    statusBox.innerHTML = `⚠️ <strong>API Responded (HTTP ${response.status}):</strong> ${errText}`;
                }
            } catch (err) {
                statusBox.className = "p-3 rounded text-sm bg-red-50 border border-red-200 font-mono text-xs text-red-700";
                statusBox.innerHTML = `❌ <strong>Fetch Blocked:</strong> ${err.message}`;
            }
        }

        testConnection();

        // --- HANDLE FORM SUBMISSION ---
        document.getElementById('beginnerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";
            msg.classList.remove('hidden');
            msg.textContent = "Sending registration details...";
            msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-slate-100 text-slate-700 border border-slate-200";

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const mobile = document.getElementById('mobile').value;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/members`, {
                    method: 'POST',
                    headers: {
                        'apikey': cleanKey,
                        'Authorization': `Bearer ${cleanKey}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        mobile: mobile,
                        membertype: 'beginner'
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    msg.innerHTML = `⚠️ <strong>Database Error:</strong> ${result.message || JSON.stringify(result)}`;
                    msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Registration";
                } else {
                    msg.innerHTML = "🎉 <strong>Registration Successful!</strong> Thank you. We have received your details.";
                    msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-green-50 text-green-700 border border-green-200 shadow-sm";
                    document.getElementById('beginnerForm').reset();
                    submitBtn.style.display = 'none';
                }
            } catch (err) {
                msg.innerHTML = `⚠️ <strong>Network Error:</strong> ${err.message}`;
                msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Registration";
            }
        });
    </script>
</body>
</html>
