<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Registration | RJD Archers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-6 font-sans text-slate-800">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold text-purple-950 mb-2">Beginner Course Registration</h1>
        <p class="text-sm text-slate-600 mb-6">Sign up to join our next beginner coaching block.</p>
        
        <!-- Live Diagnostic Banner -->
        <div id="connectionStatus" class="mb-4 p-3 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">
            🔍 Testing database connection...
        </div>

        <form id="beginnerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Full Name</label>
                <input type="text" id="name" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
                <input type="email" id="email" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Mobile Number</label>
                <input type="tel" id="mobile" required class="w-full border border-slate-300 p-2 rounded mt-1 focus:ring-2 focus:ring-purple-600 focus:outline-none">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded font-semibold hover:bg-purple-700 transition shadow">
                Submit Registration
            </button>
        </form>

        <!-- Status & Feedback Box -->
        <div id="msg" class="hidden mt-6 p-4 rounded-lg text-sm font-medium text-center transition-all"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://onepmhddrqmvhyehagkth.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';

        // Initialize Supabase client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Run an immediate connection diagnostic check on page load
        async function testDatabaseConnection() {
            const statusBox = document.getElementById('connectionStatus');
            try {
                // Perform a minimal query to verify connection and table existence
                const { data, error } = await supabaseClient
                    .from('members')
                    .select('id')
                    .limit(1);

                if (error) {
                    console.warn("Database Read Check Error:", error);
                    statusBox.className = "mb-4 p-3 rounded text-xs font-medium bg-yellow-50 text-yellow-800 border border-yellow-200";
                    statusBox.innerHTML = `⚠️ <strong>Database Alert:</strong> Connection established, but database check returned: <em>${error.message}</em>. Form inserts may still work if Insert policies exist.`;
                } else {
                    statusBox.className = "mb-4 p-3 rounded text-xs font-medium bg-green-50 text-green-700 border border-green-200";
                    statusBox.innerHTML = "✅ <strong>Database Connected:</strong> Ready to receive registrations.";
                }
            } catch (err) {
                console.error("Connection Check Failed:", err);
                statusBox.className = "mb-4 p-3 rounded text-xs font-medium bg-red-50 text-red-700 border border-red-200";
                statusBox.innerHTML = "❌ <strong>Network Error:</strong> Unable to connect to Supabase backend API. Check your internet connection or browser ad-blockers.";
            }
        }

        // Execute diagnostic test
        testDatabaseConnection();

        // Form Submit Handler
        document.getElementById('beginnerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            // Set loading UI
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";
            msg.classList.remove('hidden');
            msg.textContent = "Sending your registration details to the database...";
            msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-slate-100 text-slate-700 border border-slate-200";

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const mobile = document.getElementById('mobile').value;

            try {
                // Attempt insertion into Supabase
                const { data, error } = await supabaseClient
                    .from('members')
                    .insert([{ 
                        name: name, 
                        email: email, 
                        mobile: mobile, 
                        membertype: 'beginner' 
                    }]);

                if (error) {
                    console.error("Supabase Error Details:", error);
                    msg.innerHTML = `⚠️ <strong>Database Rejected Insert:</strong> ${error.message}<br><span class="text-xs text-red-600 mt-1 block">Check that Row Level Security (RLS) policies allow public INSERTs on table 'members'.</span>`;
                    msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Registration";
                } else {
                    console.log("Success:", data);
                    msg.innerHTML = "🎉 <strong>Registration Successful!</strong> Thank you. We have received your details and will be in touch soon.";
                    msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-green-50 text-green-700 border border-green-200 shadow-sm";
                    
                    // Reset form and remove submit button to prevent double registration
                    document.getElementById('beginnerForm').reset();
                    submitBtn.style.display = 'none';
                }
            } catch (err) {
                console.error("Fetch Exception:", err);
                msg.innerHTML = `⚠️ <strong>Network Connection Failed:</strong> ${err.message}<br><span class="text-xs text-red-600 mt-1 block">The browser could not reach https://onepmhddrqmvhyehagkth.supabase.co.</span>`;
                msg.className = "mt-6 p-4 rounded-lg text-sm font-medium text-center bg-red-50 text-red-700 border border-red-200";
                
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Registration";
            }
        });
    </script>
</body>
</html>
