<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Nights Admin | RJD Archers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-6 font-sans text-slate-800">
<div class="max-w-4xl mx-auto space-y-5">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h1 class="text-2xl font-bold text-purple-950">Club nights: attendees and set-up</h1>
        <p class="text-sm text-slate-600 mt-1">Committee and Session leads can see who is coming. Only the committee can create nights and mark payments.</p>
        <p class="text-sm mt-2"><a class="underline text-purple-700" href="/db/club-nights.html">Booking page</a> · <a class="underline text-purple-700" href="/db/security.html?next=/db/committee-club-nights.html">Enter 2FA code</a></p>
        <div id="gate" class="mt-3 text-sm"></div>
    </div>
    <div id="work" class="hidden space-y-5">
        <form id="nForm" class="hidden bg-white p-6 rounded-xl shadow-sm border border-purple-200 space-y-3">
            <h2 class="text-lg font-bold text-purple-950">Add a club night</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <label class="text-sm">Date <input id="nDate" type="date" required class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm">Indoor or outdoor
                    <select id="nKind" class="w-full border border-slate-300 p-2 rounded mt-1"><option value="indoor">Indoor</option><option value="outdoor">Outdoor</option></select></label>
                <label class="text-sm">Venue <input id="nVenue" maxlength="200" class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm">Distance <input id="nDist" type="number" min="1" max="200" value="18" required class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm">Yards or metres
                    <select id="nUnit" class="w-full border border-slate-300 p-2 rounded mt-1"><option>yards</option><option>metres</option></select></label>
                <label class="text-sm">Fee £ (blank = none) <input id="nFee" type="number" step="0.01" min="0" class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm in">Target size <input id="nSize" maxlength="40" placeholder="e.g. 40cm, 60cm" class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm in">Target type <input id="nType" maxlength="60" placeholder="e.g. Full face, Triple face" class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm">Maximum people <span id="maxHint" class="text-xs text-slate-500">(indoor max 26)</span>
                    <input id="nMax" type="number" min="1" max="26" value="26" class="w-full border border-slate-300 p-2 rounded mt-1"></label>
                <label class="text-sm sm:col-span-3">Notes <input id="nNotes" maxlength="500" class="w-full border border-slate-300 p-2 rounded mt-1"></label>
            </div>
            <button class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded font-semibold">Add night (needs 2FA)</button>
        </form>
        <div id="list" class="space-y-3"></div>
    </div>
    <div id="msg" class="text-sm text-center font-medium"></div>
</div>
<script>
    const SUPABASE_URL = 'https://onepmhddrqmvhyhagkth.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const say = (t, bad) => { $('msg').className = 'text-sm text-center font-medium ' + (bad ? 'text-red-600' : 'text-green-700'); $('msg').textContent = t || ''; };
    const gb = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const nz = s => { s = String(s ?? '').trim(); return s === '' ? null : s; };
    let isCom = false, nights = [];

    function kindUI() {
        const indoor = $('nKind').value === 'indoor';
        document.querySelectorAll('.in').forEach(e => e.classList.toggle('hidden', !indoor));
        $('nMax').max = indoor ? 26 : ''; $('maxHint').textContent = indoor ? '(indoor max 26)' : '(blank = no limit)';
        if (indoor) { $('nMax').value = $('nMax').value || 26; $('nDist').value = 18; $('nUnit').value = 'yards'; } else { $('nMax').value = ''; }
    }
    $('nKind').addEventListener('change', kindUI);

    $('nForm').addEventListener('submit', async e => {
        e.preventDefault();
        const indoor = $('nKind').value === 'indoor';
        const o = { night_date: $('nDate').value, kind: $('nKind').value, venue: nz($('nVenue').value), range_distance: Number($('nDist').value), range_unit: $('nUnit').value,
            fee: nz($('nFee').value) === null ? null : Number($('nFee').value), notes: nz($('nNotes').value),
            target_size: indoor ? nz($('nSize').value) : null, target_type: indoor ? nz($('nType').value) : null, max_places: nz($('nMax').value) === null ? null : Number($('nMax').value) };
        if (indoor && (!o.target_size || !o.target_type)) return say('Indoor nights need a target size and a target type.', true);
        if (indoor && (!o.max_places || o.max_places > 26)) return say('Indoor nights hold at most 26 people.', true);
        const { error } = await sb.from('club_nights').insert(o);
        if (error) return say(error.code === '42501' || /row-level security/.test(error.message) ? 'Committee with 2FA only: enter your 2FA code first.' : error.message, true);
        say('Night added.'); load();
    });

    function describe(n) {
        const d = n.range_distance + ' ' + n.range_unit;
        return n.kind === 'indoor' ? `Indoor, ${d}, ${esc(n.target_size)} ${esc(n.target_type)}` : `Outdoor, ${d}`;
    }
    async function load() {
        const today = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
        const { data, error } = await sb.from('club_nights').select('*').gte('night_date', today).order('night_date').limit(40);
        if (error) return say(error.message, true);
        nights = data || [];
        $('list').innerHTML = nights.map(n => `<div class="bg-white p-4 rounded-xl border border-slate-200" data-night="${esc(n.id)}">
            <div class="flex flex-wrap justify-between items-center gap-2"><div><div class="font-bold">${esc(gb(n.night_date))}</div>
            <div class="text-sm text-slate-600">${describe(n)}${n.venue ? ' · ' + esc(n.venue) : ''}${n.max_places ? ' · max ' + n.max_places : ''}</div></div>
            <div class="space-x-3"><button class="show text-purple-700 underline text-sm" data-id="${esc(n.id)}">Attendees</button>${isCom ? `<button class="del text-red-600 underline text-sm" data-id="${esc(n.id)}">Delete night</button>` : ''}</div></div>
            <div class="att mt-3 text-sm"></div></div>`).join('') || '<p class="text-center text-slate-500">No upcoming nights.</p>';
    }
    $('list').addEventListener('click', async e => {
        const card = e.target.closest('[data-night]'); if (!card) return;
        if (e.target.classList.contains('show')) return showAtt(card, e.target.dataset.id);
        if (e.target.classList.contains('del')) {
            if (!confirm('Delete this night and all its bookings?')) return;
            const { data, error } = await sb.from('club_nights').delete().eq('id', e.target.dataset.id).select('id');
            if (error || !data || !data.length) return say('Nothing deleted. Enter your 2FA code first.', true);
            say('Deleted.'); load();
        }
        if (e.target.classList.contains('paid')) {
            const { error } = await sb.rpc('committee_set_booking_paid', { p_id: e.target.dataset.id, p_paid: e.target.checked });
            if (error) { say('Committee with 2FA only.', true); e.target.checked = !e.target.checked; } else say('Saved.');
        }
    });
    async function showAtt(card, id) {
        const { data, error } = await sb.rpc('club_night_attendees', { p_night: id });
        const box = card.querySelector('.att');
        if (error) { box.textContent = ''; return say(/2FA/.test(error.message) ? 'Enter your 2FA code to see attendees.' : error.message, true); }
        const rows = data || [], n = nights.find(x => x.id === id);
        box.innerHTML = `<p class="font-semibold mb-1">${rows.length} booked${n.max_places ? ' of ' + n.max_places : ''}; juniors: ${rows.filter(r => r.is_junior).length}; first aiders: ${rows.filter(r => r.first_aider).length}</p>
            <ol class="list-decimal ml-5 space-y-0.5">${rows.map(r => `<li>${esc(r.member_name)}${r.is_junior ? ' <span class="text-xs bg-amber-100 px-1 rounded">junior</span>' : ''}${r.first_aider ? ' <span class="text-xs bg-green-100 px-1 rounded">first aider</span>' : ''}${r.club !== 'RJD Archers' ? ' <span class="text-xs text-slate-500">(' + esc(r.club) + ')</span>' : ''}
            ${isCom ? `<label class="text-xs ml-2"><input type="checkbox" class="paid" data-id="${esc(r.booking_id)}" ${r.paid ? 'checked' : ''}> paid</label>` : (r.paid ? ' <span class="text-xs text-green-700">paid</span>' : '')}</li>`).join('') || '<li class="list-none text-slate-500">Nobody yet.</li>'}</ol>`;
    }
    async function start() {
        const { data: { session } } = await sb.auth.getSession();
        const gate = $('gate');
        if (!session) {
            gate.innerHTML = '<button id="loginBtn" class="bg-purple-600 text-white px-4 py-2 rounded font-semibold">Sign in</button>';
            $('loginBtn').onclick = async () => {
                const email = prompt('Your email address:'); if (!email) return;
                const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
                say(error ? error.message : 'Check your email for the sign-in link.', !!error);
            };
            return;
        }
        const { data: c } = await sb.rpc('is_committee'); const { data: s } = await sb.rpc('is_session_lead');
        isCom = c === true;
        if (!isCom && s !== true) { gate.textContent = 'This page is for the committee and Session leads only.'; return; }
        const { data: a } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
        gate.innerHTML = (a && a.currentLevel === 'aal2') ? '<span class="text-green-700">Signed in with 2FA ✓</span>' : '<span class="text-red-700">2FA needed to see attendees.</span>';
        $('work').classList.remove('hidden'); if (isCom) { $('nForm').classList.remove('hidden'); $('nDate').value = new Date().toISOString().slice(0, 10); kindUI(); }
        load();
    }
    start();
</script>
</body>
</html>
