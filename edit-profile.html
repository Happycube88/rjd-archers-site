<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile & 2FA | RJD Archers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-6 font-sans text-slate-800">
    <div class="max-w-xl mx-auto space-y-6">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-purple-950 mb-2">Member Profile & Security (2FA)</h1>
            <p class="text-sm text-slate-600 mb-6">Log in with your email and complete 2FA verification to amend your details.</p>

            <!-- Step 1: Login / Auth -->
            <div id="authSection">
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Email Address</label>
                        <input type="email" id="loginEmail" required class="w-full border border-slate-300 p-2 rounded mt-1">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 text-white py-2.5 rounded font-semibold hover:bg-purple-700">Send Login Magic Link / OTP</button>
                </form>
            </div>

            <!-- Step 2: Edit Form (Hidden until authenticated & 2FA verified) -->
            <div id="editSection" class="hidden space-y-4 mt-6">
                <div id="mfaBadge" class="p-3 rounded text-xs bg-yellow-50 text-yellow-800 border border-yellow-200 mb-4">
                    ⚠️ 2FA Status: Checking...
                </div>
                <form id="profileForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Full Name</label>
                        <input type="text" id="editName" class="w-full border border-slate-300 p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Mobile Number</label>
                        <input type="tel" id="editMobile" class="w-full border border-slate-300 p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Postcode</label>
                        <input type="text" id="editPostcode" class="w-full border border-slate-300 p-2 rounded mt-1">
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded font-semibold hover:bg-green-700">Save Changes (Requires 2FA)</button>
                </form>
            </div>
            <div id="msg" class="mt-4 text-sm text-center font-medium"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://onepmhddrqmvhyhagkth.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZXBtaGRkcnFtdmh5aGFna3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU4MTQsImV4cCI6MjEwODAzMTgxNH0.puqAvMFt-SpG6cVedHFVSrLIx4NifALgbcJka1aXbfw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('editSection').classList.remove('hidden');
                
                // Check 2FA assurance level (aal2)
                const aal = session.user.app_metadata?.aal || 'aal1';
                const mfaBadge = document.getElementById('mfaBadge');
                if (aal === 'aal2') {
                    mfaBadge.className = "p-3 rounded text-xs bg-green-50 text-green-800 border border-green-200 mb-4";
                    mfaBadge.innerHTML = "✅ <strong>2FA Verified (AAL2):</strong> You have full permission to update your data.";
                } else {
                    mfaBadge.className = "p-3 rounded text-xs bg-red-50 text-red-800 border border-red-200 mb-4";
                    mfaBadge.innerHTML = "⚠️ <strong>2FA Required:</strong> Please set up/verify your Authenticator app via Supabase Auth to enable saving changes.";
                }

                // Load existing profile data
                const { data } = await supabaseClient.from('members').select('*').eq('id', session.user.id).single();
                if (data) {
                    document.getElementById('editName').value = data.name || '';
                    document.getElementById('editMobile').value = data.mobile || '';
                    document.getElementById('editPostcode').value = data.postcode || '';
                }
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const { error } = await supabaseClient.auth.signInWithOtp({ email });
            const msg = document.getElementById('msg');
            if (error) {
                msg.textContent = error.message;
                msg.className = "text-red-600 text-center";
            } else {
                msg.textContent = "Check your email for the login link!";
                msg.className = "text-green-600 text-center";
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            const { error } = await supabaseClient.from('members').update({
                name: document.getElementById('editName').value,
                mobile: document.getElementById('editMobile').value,
                postcode: document.getElementById('editPostcode').value
            }).eq('id', session.user.id);

            const msg = document.getElementById('msg');
            if (error) {
                msg.innerHTML = `Update failed (Ensure 2FA / AAL2 is active): ${error.message}`;
                msg.className = "text-red-600 text-center";
            } else {
                msg.innerHTML = "Profile successfully updated!";
                msg.className = "text-green-600 text-center";
            }
        });

        checkSession();
    </script>
</body>
</html>
